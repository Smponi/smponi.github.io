{{ define "main" }}
<div class="w-full mt-8">
  <div class="terminal-window w-full">
    <div class="terminal-header">
      <span class="terminal-dot terminal-dot--red"></span>
      <span class="terminal-dot terminal-dot--yellow"></span>
      <span class="terminal-dot terminal-dot--green"></span>
      <span class="terminal-title">philipp@blog:~</span>
    </div>
    <div class="terminal-body">
      <div class="terminal-line">
        <span class="terminal-prompt">$</span>
        <span>find . -name "{{ .RelPermalink | default "page" }}"</span>
      </div>
      <p class="mt-3 mb-6" style="color: #ff5f57;">Fehler 404: Seite nicht gefunden.</p>
      <div class="terminal-line">
        <span class="terminal-prompt">$</span>
        <span>cd <a href="/" class="text-primary-400 hover:text-primary-300" style="transition: color 150ms;">~</a></span>
      </div>
      <div class="terminal-line" style="margin-top: 1.5em;">
        <span class="terminal-prompt">$</span>
        <span class="terminal-cursor">_</span>
      </div>
    </div>
  </div>
</div>
{{ end }}
