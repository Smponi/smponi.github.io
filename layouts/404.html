{{ define "main" }}
<div class="w-full mt-8">
  <div class="terminal-window w-full">
    <div class="terminal-header">
      <span aria-hidden="true" class="terminal-dot terminal-dot--red"></span>
      <span aria-hidden="true" class="terminal-dot terminal-dot--yellow"></span>
      <span aria-hidden="true" class="terminal-dot terminal-dot--green"></span>
      <span class="terminal-title">philipp@blog:~</span>
    </div>
    <div class="terminal-body">
      <h1 class="visually-hidden-heading">Seite nicht gefunden</h1>
      <div class="terminal-line" aria-hidden="true">
        <span class="terminal-prompt">$</span>
        <span>cat 404.html</span>
      </div>
      <p class="mt-3 mb-6" style="color: #ff5f57;">Fehler 404: Seite nicht gefunden.</p>
      <div class="terminal-line">
        <span aria-hidden="true" class="terminal-prompt">$</span>
        <span>cd <a href="/" aria-label="Zur Startseite" class="text-primary-400 hover:text-primary-300" style="transition: color 150ms;">~</a></span>
      </div>
      <div class="terminal-line" style="margin-top: 1.5em;">
        <span aria-hidden="true" class="terminal-prompt">$</span>
        <span aria-hidden="true" class="terminal-cursor">_</span>
      </div>
    </div>
  </div>
</div>
{{ end }}
