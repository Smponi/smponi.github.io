{{ define "main" }}
<div class="lost">
  <div class="term">
    <div class="term__bar">
      <span class="term__lights" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="term__title">philipp@smponias: ~</span>
      <span class="term__size" aria-hidden="true">zsh</span>
    </div>
    <div class="term__screen">
      <h1 class="visually-hidden-heading">Seite nicht gefunden</h1>
      <div class="term__line" aria-hidden="true"><span class="term__ps1">~ $</span> cd <span data-lost-path>/irgendwo</span></div>
      <script>try { document.querySelector('[data-lost-path]').textContent = decodeURI(location.pathname); } catch (e) {}</script>
      <p class="term__line term__err">cd: Seite nicht gefunden (404)</p>
      <div class="term__line"><span class="term__ps1" aria-hidden="true">~ $</span> <a href="{{ "" | relLangURL }}">cd ~</a>   <a href="{{ "posts/" | relLangURL }}">ls posts/</a></div>
      <div class="term__line" aria-hidden="true"><span class="term__ps1">~ $</span> <span class="term__cursor"></span></div>
    </div>
  </div>
</div>
{{ end }}
