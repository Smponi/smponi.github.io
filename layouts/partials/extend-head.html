{{/* iOS: transparent status bar that blends with page background */}}
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

{{/* Cross-document view transitions: post titles morph between list and article. Ignored where unsupported. */}}
<style>
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: 160ms ease-in both vt-out; }
  ::view-transition-new(root) { animation: 260ms cubic-bezier(0.16, 1, 0.3, 1) both vt-in; }
  ::view-transition-group(*) { animation-duration: 420ms; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes vt-out { to { opacity: 0; } }
  @keyframes vt-in { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
  }
</style>
