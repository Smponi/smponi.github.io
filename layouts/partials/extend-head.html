{{/* iOS: transparent status bar that blends with page background */}}
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

{{/* View Transitions API — progressive enhancement (Chromium only, ignored elsewhere) */}}
<meta name="view-transition" content="same-origin">
<style>
  @view-transition { navigation: auto; }

  ::view-transition-old(root) {
    animation: vt-fade-out 150ms ease-in;
  }
  ::view-transition-new(root) {
    animation: vt-fade-in 200ms ease-out;
  }

  @keyframes vt-fade-out { to { opacity: 0; } }
  @keyframes vt-fade-in { from { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    @view-transition { navigation: none; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  }
</style>
