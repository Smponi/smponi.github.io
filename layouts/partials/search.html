<dialog id="search-dialog" aria-labelledby="search-dialog-title" data-url="{{ "" | absLangURL }}">
  <div id="search-modal" class="flex flex-col w-full max-w-3xl min-h-0 mx-auto border rounded-md shadow-lg border-neutral-200 bg-neutral dark:border-neutral-700 dark:bg-neutral-800">
    <header class="relative z-10 flex items-center justify-between flex-none px-2">
      <form class="flex items-center flex-auto min-w-0" role="search" onsubmit="return false;">
        <div aria-hidden="true" class="flex items-center justify-center w-8 h-8 text-neutral-400">{{ partial "icon.html" "search" }}</div>
        <h2 id="search-dialog-title" class="visually-hidden-heading">{{ i18n "search.dialog_label" }}</h2>
        <label class="visually-hidden-heading" for="search-query">{{ i18n "search.input_label" }}</label>
        <input type="search" id="search-query" class="flex flex-auto h-12 mx-1 bg-transparent appearance-none focus:outline-dotted focus:outline-2 focus:outline-transparent" placeholder="{{ i18n "search.input_placeholder" }}" autocomplete="off">
      </form>
      <button id="close-search-button" type="button" class="dialog-icon-button flex items-center justify-center text-neutral-700 hover:text-primary-600 dark:text-neutral dark:hover:text-primary-400" aria-label="{{ i18n "search.close_button_title" }}" title="{{ i18n "search.close_button_title" }}">{{ partial "icon.html" "xmark" }}</button>
    </header>
    <p id="search-status" class="visually-hidden-heading" aria-live="polite" aria-atomic="true"></p>
    <section class="flex-auto px-2 overflow-auto" aria-label="Suchergebnisse"><ul id="search-results"></ul></section>
  </div>
</dialog>
