{{/* One entry in a post index. Shared by the homepage, /posts/ and tag pages. */}}
<li class="post-row">
  <a href="{{ .RelPermalink }}" class="post-row__link">
    <h3 class="post-row__title" style="view-transition-name: post-{{ .File.ContentBaseName | anchorize }}">{{ .Title | emojify }}</h3>
    {{ with .Description }}<p class="post-row__desc">{{ . }}</p>{{ end }}
    <span class="post-row__meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>
      <span>{{ .ReadingTime }} min</span>
    </span>
  </a>
</li>
