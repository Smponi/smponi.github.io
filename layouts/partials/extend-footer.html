<script>
(function () {
  var menu = document.getElementById('mobile-menu');
  var open = document.getElementById('mobile-menu-button');
  var close = document.getElementById('mobile-menu-close');
  var returnFocus;
  if (menu && open && close) {
    open.addEventListener('click', function () { returnFocus = open; menu.showModal(); close.focus(); });
    close.addEventListener('click', function () { menu.close(); });
    menu.addEventListener('keydown', function (event) { if (event.key === 'Escape') { event.preventDefault(); menu.close(); } });
    menu.addEventListener('close', function () { if (returnFocus) returnFocus.focus(); });
    menu.addEventListener('click', function (event) { if (event.target === menu) menu.close(); });
  }

  /* j / k move through post lists, like any good TUI */
  var rows = document.querySelectorAll('[data-post-list] .post-row__link');
  if (rows.length) document.addEventListener('keydown', function (event) {
    var key = event.key, active = document.activeElement, tag = active && active.tagName;
    if ((key !== 'j' && key !== 'k') || event.metaKey || event.ctrlKey || event.altKey || document.querySelector('dialog[open]')) return;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (active && active.isContentEditable)) return;
    var list = Array.prototype.slice.call(rows), at = list.indexOf(active);
    var next = key === 'j' ? (at < 0 ? 0 : Math.min(at + 1, list.length - 1)) : (at < 0 ? list.length - 1 : Math.max(at - 1, 0));
    event.preventDefault();
    list[next].focus();
    list[next].scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });

  /* Reading progress: CSS scroll timeline does the work where it exists */
  if (document.querySelector('.post-body')) {
    var bar = document.createElement('div');
    bar.className = 'reading-progress';
    bar.setAttribute('aria-hidden', 'true');
    document.body.appendChild(bar);
    if (!(window.CSS && CSS.supports('animation-timeline: scroll()'))) {
      var update = function () {
        var total = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.transform = 'scaleX(' + (total > 0 ? Math.min(window.scrollY / total, 1) : 1) + ')';
      };
      window.addEventListener('scroll', update, { passive: true });
      update();
    }
  }
}());
</script>
