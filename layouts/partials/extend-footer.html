{{/* Cmd/Ctrl+K → open search (mirrors the existing "/" shortcut from Blowfish) */}}
{{ if site.Params.enableSearch }}
<script>
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "k") {
      e.preventDefault();
      var btn = document.getElementById("search-button") ||
                document.getElementById("search-button-mobile");
      if (btn) btn.click();
    }
  });
</script>
{{ end }}

{{/* Scroll-reveal: fade-in elements with [data-reveal] as they enter viewport */}}
<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('[data-reveal]').forEach(function (el) { el.classList.add('revealed'); });
    return;
  }
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('revealed'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('[data-reveal]').forEach(function (el) { obs.observe(el); });
})();
</script>

{{/* Reading progress bar — only on single article pages */}}
<script>
(function () {
  var article = document.querySelector('article .prose');
  if (!article) return;
  var bar = document.createElement('div');
  bar.className = 'reading-progress';
  document.body.appendChild(bar);

  var ticking = false;
  function update() {
    var rect = article.getBoundingClientRect();
    var total = article.scrollHeight - window.innerHeight;
    if (total <= 0) { bar.style.width = '100%'; return; }
    var pct = Math.min(Math.max(-rect.top / total, 0), 1) * 100;
    bar.style.width = pct + '%';
  }

  window.addEventListener('scroll', function () {
    if (!ticking) { requestAnimationFrame(function () { update(); ticking = false; }); ticking = true; }
  }, { passive: true });
  update();
})();
</script>
