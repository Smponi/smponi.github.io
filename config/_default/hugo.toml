# -- Site Configuration --
# https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://philipp.smponias.de/"
defaultContentLanguage = "de"
disableLanguages = ["fr", "en", "it", "pt-br", "pt-pt", "es", "ja", "zh-cn"]

enableRobotsTXT = true
summaryLength = 30
enableEmoji = true

buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 20

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
